<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10151b"><link rel="manifest" href="manifest.json"><title>Bandlogistik</title><style>
:root{--bg:#10151b;--card:#1a222c;--line:#334250;--text:#f4f7f9;--muted:#a5b1bc;--accent:#f7b538;--green:#55d6a3;--red:#ff7b7b;font-family:system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}.app{max-width:1000px;margin:auto;padding:20px 16px 60px}header{display:flex;justify-content:space-between;align-items:start;gap:12px}h1{margin:0;font-size:28px}h2{font-size:18px;margin:0 0 12px}h3{font-size:14px;margin:0;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}.sub,.hint,small{color:var(--muted)}.sub{margin:3px 0 14px}.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:18px 0}.nav button{background:#202b37;color:var(--muted);border:1px solid var(--line)}.nav button.active{background:var(--accent);color:#1b2028;border-color:var(--accent)}button,input,select,textarea{font:inherit}button{border:0;border-radius:8px;padding:9px 11px;background:var(--accent);font-weight:700;cursor:pointer;color:#17202a}button.secondary{background:#273443;color:var(--text);border:1px solid var(--line)}button.danger{background:none;color:var(--red);padding:6px}.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:15px;margin-top:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.grid.two{grid-template-columns:repeat(2,1fr)}label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}input,select,textarea{width:100%;border-radius:8px;border:1px solid var(--line);background:#101820;color:var(--text);padding:9px}textarea{min-height:85px;resize:vertical}.wide{grid-column:span 2}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.actions button{flex:0 1 auto}.row{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:8px;background:#121a23;border:1px solid var(--line);border-radius:9px;padding:9px;margin-top:7px}.row strong{display:block}.meta{font-size:12px;color:var(--muted);margin-top:2px}.qty{color:var(--accent);font-weight:800;white-space:nowrap}.empty{padding:20px;text-align:center;border:1px dashed var(--line);border-radius:10px;color:var(--muted);margin-top:12px}.tag{font-size:11px;border:1px solid var(--line);border-radius:99px;padding:3px 7px;color:var(--muted);display:inline-block;margin:4px 4px 0 0}.banner{border-left:3px solid var(--accent);padding-left:10px;margin:0 0 12px;font-size:13px;color:var(--muted)}.load-row{grid-template-columns:auto 1fr auto}.load-row input[type=checkbox]{width:23px;height:23px;accent-color:var(--green)}.done{opacity:.55;text-decoration:line-through}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}.notice{font-size:13px;color:var(--green);min-height:18px}@media(max-width:680px){.split{grid-template-columns:1fr}.nav{grid-template-columns:1fr 1fr}.nav button{font-size:13px}}@media(max-width:560px){.app{padding:16px 12px 44px}h1{font-size:25px}.grid,.grid.two{grid-template-columns:1fr}.wide{grid-column:auto}.card{padding:13px}.row{grid-template-columns:1fr auto}.row>span:last-child,.row>button:last-child{grid-column:2}.load-row{grid-template-columns:auto 1fr}.load-row select{grid-column:2}.actions button{flex:1 1 auto}}
</style></head><body><main class="app"><header><div><h1>Bandlogistik</h1><p class="sub">Lager → konfiguration → gigplan → loadout</p></div><span class="tag" id="summary"></span></header><nav class="nav"><button data-view="inventory">1. Lager</button><button data-view="configs">2. Konfigurationer</button><button data-view="gigs">3. Gig & historik</button><button data-view="loadout">4. Loadout</button></nav><div id="view"></div></main><script>
(()=>{'use strict';const KEY='bandlogistik:v1',$=id=>document.getElementById(id),uid=()=>crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);let state=load();let view='inventory',editingInventory=null,activeConfig=null,activeGig=null;function load(){try{return JSON.parse(localStorage.getItem(KEY))||{inventory:[],configs:[],gigs:[],boxes:[]}}catch{return{inventory:[],configs:[],gigs:[],boxes:[]}}}function save(){localStorage.setItem(KEY,JSON.stringify(state));render()}function esc(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML}function item(id){return state.inventory.find(x=>x.id===id)}function config(id){return state.configs.find(x=>x.id===id)}function gig(id){return state.gigs.find(x=>x.id===id)}function inventoryOptions(selected=''){return '<option value="">Välj utrustning…</option>'+state.inventory.map(x=>`<option value="${x.id}" ${x.id===selected?'selected':''}>${esc(x.name)} — ${x.stock} st i lager</option>`).join('')}function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$('summary').textContent=`${state.inventory.length} utrustningsposter · ${state.gigs.length} gig`;({inventory:renderInventory,configs:renderConfigs,gigs:renderGigs,loadout:renderLoadout}[view])()}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});
function renderInventory(){const edit=editingInventory&&item(editingInventory);$('view').innerHTML=`<section class="card"><h2>${edit?'Redigera utrustning':'Lägg till utrustning'}</h2><p class="banner">Varje fysisk pryl eller kabeltyp läggs in här en gång. Lagret är källan för alla konfigurationer och gig.</p><div class="grid"><div><label>Namn</label><input id="i-name" value="${esc(edit?.name)}" placeholder="T.ex. Gibson Les Paul"></div><div><label>Typ / kategori</label><input id="i-type" value="${esc(edit?.type)}" placeholder="Gitarr, kabel, mixer…"></div><div><label>Antal i lager</label><input id="i-stock" type="number" min="1" value="${edit?.stock||1}"></div><div class="wide"><label>Anteckning</label><input id="i-note" value="${esc(edit?.note)}" placeholder="T.ex. svart case, behöver laddas"></div></div><div class="actions"><button id="save-inventory">${edit?'Spara ändringar':'Spara i lagret'}</button>${edit?'<button class="secondary" id="cancel-inventory">Avbryt</button>':''}</div></section><section class="card"><h2>Ert lager</h2>${state.inventory.length?state.inventory.map(x=>`<div class="row"><div><strong>${esc(x.name)}</strong><div class="meta">${esc(x.type||'Okategoriserad')}${x.note?' · '+esc(x.note):''}</div></div><span class="qty">${x.stock} st</span><span><button class="secondary" data-edit-item="${x.id}">Redigera</button><button class="danger" data-delete-item="${x.id}">Ta bort</button></span></div>`).join(''):'<div class="empty">Lägg in er första utrustning: kablar, gitarrer, mixer, monitorer, case och allt annat.</div>'}</section>`;$('save-inventory').onclick=()=>{const name=$('i-name').value.trim(),stock=Number($('i-stock').value);if(!name||stock<1)return alert('Ange namn och antal i lager.');const data={name,type:$('i-type').value.trim(),stock,note:$('i-note').value.trim()};if(edit){Object.assign(edit,data)}else state.inventory.push({id:uid(),...data});editingInventory=null;save()};$('cancel-inventory')&&( $('cancel-inventory').onclick=()=>{editingInventory=null;render()});document.querySelectorAll('[data-edit-item]').forEach(b=>b.onclick=()=>{editingInventory=b.dataset.editItem;render()});document.querySelectorAll('[data-delete-item]').forEach(b=>b.onclick=()=>{const x=item(b.dataset.deleteItem);if(confirm(`Ta bort ${x.name} från lagret? Den tas bort från konfigurationer, men historiska gig sparas.`)){state.inventory=state.inventory.filter(i=>i.id!==x.id);state.configs.forEach(c=>c.items=c.items.filter(i=>i.inventoryId!==x.id));save()}})}
function configItemsHtml(c,editable){if(!c.items.length)return '<div class="empty">Inga utrustningsposter ännu.</div>';return c.items.map(ci=>{const x=item(ci.inventoryId);return `<div class="row"><div><strong>${esc(x?.name||ci.name)}</strong><div class="meta">${esc(x?.type||'Borttagen från lagret')}</div></div><span class="qty">${ci.qty} st</span>${editable?`<button class="danger" data-remove-config-item="${ci.inventoryId}">Ta bort</button>`:'<span></span>'}</div>`}).join('')}
function renderConfigs(){const c=activeConfig&&config(activeConfig);const configRows=state.configs.map(x=>'<div class="row"><div><strong>'+esc(x.name)+'</strong><div class="meta">'+x.items.length+' utrustningsposter</div></div><button class="secondary" data-open-config="'+x.id+'">Öppna</button><button class="danger" data-delete-config="'+x.id+'">Ta bort</button></div>').join('')||'<div class="empty">Skapa en uppsättning, t.ex. “Akustiskt set”, “Klubbset” eller “Stora scenen”.</div>';const baseOptions='<option value="">Tom konfiguration</option>'+state.configs.map(x=>'<option value="config:'+x.id+'">'+esc(x.name)+'</option>').join('')+state.gigs.map(x=>'<option value="gig:'+x.id+'">Gig: '+esc(x.name)+'</option>').join('');const editor=c?'<h2>'+esc(c.name)+'</h2><div class="grid two"><div><label>Utrustning från lagret</label><select id="add-to-config">'+inventoryOptions()+'</select></div><div><label>Antal</label><input id="config-qty" type="number" min="1" value="1"></div></div><div class="actions"><button id="add-config-item">Lägg till / uppdatera</button><button class="secondary" id="rename-config">Byt namn</button></div><p class="notice" id="config-notice"></p>'+configItemsHtml(c,true):'<h2>Öppna en konfiguration</h2><p class="hint">Välj en i listan för att lägga till lagerutrustning.</p>';$('view').innerHTML='<div class="split"><section class="card"><h2>Konfigurationer</h2><p class="banner">En konfiguration är en sparad kombination av er lagerutrustning. Samma pryl kan bara finnas en gång per konfiguration, och antal kan aldrig överstiga lagersaldot.</p><div class="grid two"><div><label>Namn</label><input id="c-name" placeholder="T.ex. Klubbset / fullband"></div><div><label>Bygg vidare på</label><select id="c-base">'+baseOptions+'</select></div></div><div class="actions"><button id="create-config">Skapa konfiguration</button></div>'+configRows+'</section><section class="card">'+editor+'</section></div>';$('create-config').onclick=()=>{const name=$('c-name').value.trim();if(!name)return alert('Ge konfigurationen ett namn.');let items=[];const base=$('c-base').value;if(base){const [kind,id]=base.split(':');items=kind==='config'?clonePlan(config(id).items):clonePlan(gig(id).plan)}const next={id:uid(),name,items};state.configs.push(next);activeConfig=next.id;save()};document.querySelectorAll('[data-open-config]').forEach(b=>b.onclick=()=>{activeConfig=b.dataset.openConfig;render()});document.querySelectorAll('[data-delete-config]').forEach(b=>b.onclick=()=>{if(confirm('Ta bort konfigurationen?')){state.configs=state.configs.filter(x=>x.id!==b.dataset.deleteConfig);if(activeConfig===b.dataset.deleteConfig)activeConfig=null;save()}});if(c){$('add-config-item').onclick=()=>{const inv=item($('add-to-config').value),qty=Number($('config-qty').value);if(!inv||qty<1)return;const old=c.items.find(x=>x.inventoryId===inv.id);if(qty>inv.stock)return notice('Det finns bara '+inv.stock+' st '+inv.name+' i lagret.');if(old)old.qty=qty;else c.items.push({inventoryId:inv.id,name:inv.name,qty});save()};$('rename-config').onclick=()=>{const name=prompt('Nytt namn:',c.name);if(name?.trim()){c.name=name.trim();save()}};document.querySelectorAll('[data-remove-config-item]').forEach(b=>b.onclick=()=>{c.items=c.items.filter(x=>x.inventoryId!==b.dataset.removeConfigItem);save()})}}function notice(t){$('config-notice').textContent=t}
function clonePlan(items){return(items||[]).map(x=>({inventoryId:x.inventoryId,name:x.name||item(x.inventoryId)?.name||'Okänd utrustning',qty:x.qty}))}
function renderGigs(){const g=activeGig&&gig(activeGig);$('view').innerHTML=`<div class="split"><section class="card"><h2>Planera nytt gig</h2><p class="banner">Välj en konfiguration som startpunkt. Giget blir en egen sparad plan och påverkas inte om du senare ändrar en mall.</p><div class="grid"><div><label>Gignamn</label><input id="g-name" placeholder="T.ex. Kvarteret & Co"></div><div><label>Spelställe</label><input id="g-venue" placeholder="T.ex. Debaser"></div><div><label>Datum</label><input id="g-date" type="date"></div><div class="wide"><label>Starta från konfiguration</label><select id="g-config"><option value="">Tom plan</option>${state.configs.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div></div><div class="actions"><button id="create-gig">Skapa gigplan</button></div><h2 style="margin-top:22px">Tidigare och planerade gig</h2>${state.gigs.length?state.gigs.map(x=>`<div class="row"><div><strong>${esc(x.name)}</strong><div class="meta">${esc(x.venue||'Inget spelställe')} · ${x.date||'Inget datum'} · ${x.plan.length} poster</div></div><button class="secondary" data-open-gig="${x.id}">Öppna</button><button class="danger" data-delete-gig="${x.id}">Ta bort</button></div>`).join(''):'<div class="empty">Här blir er gig-historik. Öppna ett gammalt gig för att se plan, lådor och anteckningar.</div>'}</section><section class="card">${g?gigDetail(g):'<h2>Gigdetaljer</h2><p class="hint">Öppna eller skapa ett gig för att ändra plan och skriva erfarenheter.</p>'}</section></div>`;$('create-gig').onclick=()=>{const name=$('g-name').value.trim();if(!name)return alert('Ange gignamn.');const c=config($('g-config').value);const newGig={id:uid(),name,venue:$('g-venue').value.trim(),date:$('g-date').value,plan:clonePlan(c?.items),notes:'',loadout:{}};state.gigs.unshift(newGig);activeGig=newGig.id;save()};document.querySelectorAll('[data-open-gig]').forEach(b=>b.onclick=()=>{activeGig=b.dataset.openGig;render()});document.querySelectorAll('[data-delete-gig]').forEach(b=>b.onclick=()=>{if(confirm('Ta bort gigget och dess historik?')){state.gigs=state.gigs.filter(x=>x.id!==b.dataset.deleteGig);if(activeGig===b.dataset.deleteGig)activeGig=null;save()}});bindGigDetail(g)}
function gigDetail(g){return `<h2>${esc(g.name)}</h2><div class="meta">${esc(g.venue||'Inget spelställe')} · ${g.date||'Inget datum'}</div><h3 style="margin-top:18px">Gigplan</h3>${g.plan.length?g.plan.map(p=>`<div class="row"><div><strong>${esc(p.name)}</strong></div><span class="qty">${p.qty} st</span><button class="danger" data-remove-plan="${p.inventoryId}">Ta bort</button></div>`).join(''):'<div class="empty">Tom plan.</div>'}<div class="grid two" style="margin-top:12px"><div><label>Lägg till extra utrustning</label><select id="plan-inventory">${inventoryOptions()}</select></div><div><label>Antal</label><input id="plan-qty" type="number" min="1" value="1"></div></div><div class="actions"><button id="add-plan">Lägg till / uppdatera</button><button class="secondary" id="go-loadout">Öppna loadout</button></div><h3 style="margin-top:20px">Efter giget – vad lärde ni er?</h3><label for="gig-notes">Kommentarer om utrustning, saknade saker och förbättringar</label><textarea id="gig-notes" placeholder="T.ex. två monitorer räckte inte, ta längre XLR nästa gång…">${esc(g.notes)}</textarea><div class="actions"><button id="save-notes">Spara kommentarer</button></div>`}
function bindGigDetail(g){if(!g)return;document.querySelectorAll('[data-remove-plan]').forEach(b=>b.onclick=()=>{g.plan=g.plan.filter(p=>p.inventoryId!==b.dataset.removePlan);save()});$('add-plan').onclick=()=>{const x=item($('plan-inventory').value),qty=Number($('plan-qty').value);if(!x||qty<1)return;if(qty>x.stock)return alert(`Bara ${x.stock} st finns i lagret.`);const p=g.plan.find(z=>z.inventoryId===x.id);if(p)p.qty=qty;else g.plan.push({inventoryId:x.id,name:x.name,qty});save()};$('save-notes').onclick=()=>{g.notes=$('gig-notes').value.trim();save()};$('go-loadout').onclick=()=>{view='loadout';render()}}
function renderLoadout(){const g=activeGig&&gig(activeGig)||state.gigs[0];if(g)activeGig=g.id;$('view').innerHTML=`<section class="card"><h2>Loadout</h2><p class="banner">Det här läget är bara för packning. Planering och mallbygge ligger separat, så du får en ren avprickningslista här.</p><div class="grid two"><div><label>Gig</label><select id="loadout-gig">${state.gigs.map(x=>`<option value="${x.id}" ${x.id===g?.id?'selected':''}>${esc(x.name)}${x.date?' · '+x.date:''}</option>`).join('')}</select></div><div><label>Ny låda / case</label><div class="actions" style="margin:0"><input id="new-box" placeholder="T.ex. Case 3"><button id="add-box">Spara låda</button></div></div></div>${g?`<h3 style="margin-top:20px">${esc(g.name)}</h3>${g.plan.length?g.plan.map(p=>loadRow(g,p)).join(''):'<div class="empty">Gigplanen är tom.</div>'}`:'<div class="empty">Skapa ett gig först.</div>'}</section>`;$('loadout-gig')&&($('loadout-gig').onchange=()=>{activeGig=$('loadout-gig').value;render()});$('add-box')&&($('add-box').onclick=()=>{const b=$('new-box').value.trim();if(b&&!state.boxes.includes(b)){state.boxes.push(b);save()}});document.querySelectorAll('[data-packed]').forEach(b=>b.onchange=()=>{const [iid]=b.dataset.packed.split('|');g.loadout[iid]??={};g.loadout[iid].packed=b.checked;save()});document.querySelectorAll('[data-box]').forEach(s=>s.onchange=()=>{const iid=s.dataset.box;g.loadout[iid]??={};g.loadout[iid].box=s.value;save()})}
function loadRow(g,p){const l=g.loadout[p.inventoryId]||{},boxes='<option value="">Ingen låda angiven</option>'+state.boxes.map(b=>`<option ${l.box===b?'selected':''}>${esc(b)}</option>`).join('');return `<div class="row load-row ${l.packed?'done':''}"><input type="checkbox" data-packed="${p.inventoryId}|x" ${l.packed?'checked':''}><div><strong>${esc(p.name)}</strong><div class="meta">${p.qty} st</div></div><select data-box="${p.inventoryId}">${boxes}</select></div>`}
render()})();
</script></body></html>
